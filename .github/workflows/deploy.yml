name: deploy

# Auto-deploy the game when main advances (a PR is merged). Can also be run on
# demand from the Actions tab. The build (pnpm + vite) runs on the server via
# ci/deploy.sh — this job just opens an SSH session and streams the script in.
# Requires repo secrets DEPLOY_SSH_KEY + DEPLOY_HOST.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-gta
  cancel-in-progress: false

jobs:
  # The suite stands between main and the server (PLAN-WORLDGEN.md wave 0.4).
  # Same steps as test.yml; duplicated here rather than chained through
  # workflow_run so the gate is visible in this file and a deploy cannot be
  # dispatched around it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: City checker on the shipped asset
        run: node server/dist/tools/citybake.js --check

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4      # only to get ci/deploy.sh onto the runner

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@${DEPLOY_HOST}" 'bash -s' < ci/deploy.sh
