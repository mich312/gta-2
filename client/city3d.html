<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>city in 3d</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 8px; top: 8px; z-index: 2;
        font: 12px/1.5 monospace; color: #cdd6e0;
        background: rgba(6, 10, 16, 0.72); padding: 6px 9px; white-space: pre;
      }
    </style>
  </head>
  <body>
    <!--
      The game, playable, in 3D (3D.md W3a).

      Runs the offline host in a worker — the same one `?local=1` uses — and
      draws the same interpolated state the 2D renderer draws, so the two
      views are looking at one game rather than two.

        WASD drive/walk   E enter or leave a car   Space fire

        ?seed=   city seed          ?pitch=  camera tilt, degrees from vertical
        ?h=      view height, px    ?night=  0 midday, 1 midnight
        ?peds=   crowd size         ?fly=1   circle the city instead of playing
        ?wet=    0 dry, 1 just rained
        ?at=tx,ty  (with fly=1) hold the flyover over this tile instead of
                   orbiting — how the shoreline and kerb evidence is retaken
        ?tick=   (with fly=1) freeze the traffic signals at this tick
    -->
    <div id="hud">building…</div>
    <canvas id="view"></canvas>
    <script type="module">
      import { generateCity } from 'shared';
      import { CityView } from '/src/three/cityView.ts';
      import { Live } from '/src/three/live.ts';
      import { initLocalTuning, localWorldgenParams } from '/src/local/tuning.ts';

      const q = new URLSearchParams(location.search);
      const num = (k, d) => Number.parseFloat(q.get(k) ?? String(d));
      const seed = Number.parseInt(q.get('seed') ?? '7', 10);
      const pitch = num('pitch', 42);
      const viewHeight = num('h', 420);
      const night = num('night', 0.15);
      const wet = num('wet', 0);
      const peds = Number.parseInt(q.get('peds') ?? '160', 10);

      const canvas = document.getElementById('view');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const hud = document.getElementById('hud');

      if (q.get('fly') === '1') {
        // Flyover: no sim, just the city. Useful for looking at geometry
        // without a player in the way.
        initLocalTuning('normal');
        const map = generateCity(seed, localWorldgenParams());
        const viewH = num('h', 900);
        const view = new CityView({ canvas, map, pitch, viewHeight: viewH });
        view.setNight(night);
        const { SceneryLayer } = await import('/src/three/scenery.ts');
        new SceneryLayer(view.world).setMap(map);
        // The painted ground, exactly as `Live` wires it — without it the
        // flyover shows the flat instanced slabs, which is a different city
        // from the one anybody plays in (and shows none of the bevelled
        // shoreline the painter draws).
        const { TileLayer } = await import('/src/render/tiles.ts');
        const { SpriteSheet } = await import('/src/render/sprites.ts');
        const { GroundLayer } = await import('/src/three/ground.ts');
        const painter = new TileLayer(new SpriteSheet());
        painter.setMap(map);
        const ground = new GroundLayer(view.world, painter);
        ground.setMap(map);
        ground.setWeather(wet, night);
        // Street furniture — signal heads on their posts, and the hidden
        // packages. `Live` has always built this layer and the flyover never
        // did (WORLDGEN.md §50.5), so every piece of 3D evidence this repo has ever taken
        // showed a city with no lights in it: junctions were reviewed, twice,
        // from pictures that could not have contained a signal. There is no
        // sim here, so the layer is handed the least a scene can be — no
        // pickups, no projectiles, nothing found — and a tick, which is all
        // the signal phase is a function of.
        const { WorldObjectsLayer } = await import('/src/three/worldObjects.ts');
        const objects = new WorldObjectsLayer(view.world);
        objects.setMap(map);
        // Street lamps, from the map's own prop list.
        //
        // `Lights3dLayer` is wired up in `main.ts` and never was here, so the
        // flyover has no street lighting at any hour — which made every night
        // shot this repo has taken a picture of an unlit city, and made the
        // one thing a night shot is FOR impossible to review (§55.7). The
        // layer reads lamps off `scene.remotes.props`, and the sim streams
        // those from `map.propSpawns`; with no sim here, the same list is
        // handed over directly. Ids are the index, so a lamp's flicker
        // character is stable between retakes exactly as it is in the game.
        const lamps = (map.propSpawns ?? [])
          .map((p, i) => ({ ...p, id: i, pos: { x: p.x, y: p.y }, intact: true }))
          .filter((p) => p.kind === 'lamp');
        const emptyScene = {
          remotes: { pickups: [], projectiles: [], props: lamps, vehicles: [], peds: [] },
          foundPackages: new Set(),
          nowMs: 0,
          tick: 0,
        };
        const noEffects = { flashPool: [], particlePool: [] };
        const { Lights3dLayer } = await import('/src/three/lights3d.ts');
        const lights3d = new Lights3dLayer(view.world);
        lights3d.setMap(map);
        // Hold over a named tile, or orbit the centre as before.
        const at = (q.get('at') ?? '').split(',').map((v) => Number.parseFloat(v));
        const hold = at.length === 2 && at.every(Number.isFinite)
          ? { x: at[0] * 16, y: at[1] * 16 }
          : null;
        const cx = (map.widthTiles * 16) / 2;
        const cy = (map.heightTiles * 16) / 2;
        let t = 0;
        // The flyover reported no timing at all, which made it the one page
        // you could not tell a slow frame from a fast one on.
        let frames = 0, last = performance.now(), fps = 0;
        const tick = (now) => {
          t += 0.0016;
          const fx = hold ? hold.x : cx + Math.cos(t) * 500;
          const fy = hold ? hold.y : cy + Math.sin(t) * 500;
          view.lookAt(fx, fy);
          // Same guess Live makes: the layer only uses the box to decide
          // which chunks to paint, with a margin either way.
          const cam = { x: fx - viewH, y: fy - viewH / 2 };
          const box = { w: viewH * 2, h: viewH };
          ground.update(cam, box);
          // `?tick=` freezes the signal phase, so a retake of the same
          // junction shows the same lights and two stills can be compared.
          emptyScene.nowMs = now;
          emptyScene.tick = Number.parseInt(q.get('tick') ?? '', 10) || Math.floor(now / 16.67);
          objects.update(emptyScene, cam, box);
          lights3d.update(emptyScene, noEffects, night, { x: fx, y: fy }, cam, {
            w: box.w,
            h: box.h,
          });
          view.render();
          frames++;
          if (now - last > 500) {
            fps = (frames * 1000) / (now - last);
            frames = 0; last = now;
          }
          const s = view.stats();
          hud.textContent =
            `seed ${seed}  pitch ${pitch}°  flyover\n` +
            `${map.buildings.length} buildings\n` +
            `draws ${s.draws}  instances ${s.instances}  tris ${(s.triangles / 1000) | 0}k\n` +
            `${fps.toFixed(fps < 10 ? 2 : 0)} fps  ${(1000 / Math.max(fps, 0.001)).toFixed(0)} ms/frame`;
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        globalThis.__city = view;
        // For the capture harness: painted-chunk residency is the only way
        // to know the ground has caught up under a software renderer, where
        // the 2-chunks-a-frame budget can take a minute to fill a view.
        globalThis.__ground = ground;
      } else {
        const live = new Live({ canvas, seed, pitch, viewHeight, peds, night, wet });
        live.start();
        globalThis.__live = live;
        let frames = 0, last = performance.now(), fps = 0;
        const tick = (now) => {
          frames++;
          if (now - last > 500) {
            fps = (frames * 1000) / (now - last);
            frames = 0; last = now;
            const s = live.stats();
            hud.textContent =
              `seed ${seed}  pitch ${pitch}°\n` +
              `WASD drive  E in/out  Space fire\n` +
              (s ? `draws ${s.draws}  instances ${s.instances}  tris ${(s.triangles / 1000) | 0}k\n` : '') +
              // Milliseconds as well as the rate. Rounded to whole frames a
              // slow renderer reports "0 fps", which is indistinguishable from
              // a hung one — and it was read as a hang.
              `${fps.toFixed(fps < 10 ? 2 : 0)} fps  ${(1000 / Math.max(fps, 0.001)).toFixed(0)} ms/frame`;
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        (globalThis.__city ?? globalThis.__live?.view)?.resize?.(canvas.width, canvas.height);
      });
    </script>
  </body>
</html>
