<meta charset="utf-8">
<style>
  body { margin: 0; background: #12141a; color: #dfe6f2; font: 12px/1.3 ui-monospace, monospace; }
  h2 { font: 600 14px ui-monospace, monospace; color: #8fd6ff; margin: 18px 0 8px 14px; letter-spacing: .08em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 14px; }
  .cell { width: 110px; text-align: center; }
  .cell canvas { display: block; margin: 0 auto 4px; image-rendering: pixelated; background: #1b1f28; border: 1px solid #2a303c; border-radius: 4px; }
  .cell span { color: #9fb0c8; word-break: break-all; }
</style>
<div id="out"></div>
<script type="module">
const meta = await (await fetch('/sprites.meta.json')).json();
const img = new Image();
img.src = '/sprites.png';
await img.decode();
const GROUPS = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const out = document.getElementById('out');
for (const [title, names] of GROUPS) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';
  for (const name of names) {
    const f = meta.frames[name];
    const cell = document.createElement('div');
    cell.className = 'cell';
    const c = document.createElement('canvas');
    c.width = 100; c.height = 76;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    if (f) {
      const s = Math.min(3, Math.floor(Math.min(92 / f.w, 68 / f.h) * 2) / 2) || 1;
      g.drawImage(img, f.x, f.y, f.w, f.h,
        Math.round((100 - f.w * s) / 2), Math.round((76 - f.h * s) / 2), f.w * s, f.h * s);
    } else {
      g.fillStyle = '#5a2030'; g.fillRect(0, 0, 100, 76);
      g.fillStyle = '#ffb0c0'; g.font = '11px monospace'; g.fillText('MISSING', 22, 42);
    }
    cell.appendChild(c);
    const sp = document.createElement('span');
    sp.textContent = name;
    cell.appendChild(sp);
    row.appendChild(cell);
  }
  out.appendChild(row);
}
document.title = 'ready';
</script>
