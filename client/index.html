<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>topdown-city</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      /* The 3D world canvas sits behind the HUD canvas.
         Both are centred the same way so they overlap exactly: the body is a
         centring flex container, and this is pulled out of flow and centred
         by transform so it lands on the same box without becoming a flex item
         that would push the HUD canvas aside. Hidden entirely in 2D mode. */
      #world {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        /* Pixelated like the HUD canvas above it, so the two layers cannot
           disagree about sharpness. `main.ts` overrides this per fit — smooth
           only where the upscale ratio is fractional and even pixels are
           impossible. `auto` here was the single loudest softness in the
           frame: the world store bilinearly stretched under a razor-sharp
           HUD. */
        image-rendering: pixelated;
      }
      /* Above the world, and — in 3D — see-through. The shared `background`
         below would otherwise paint this canvas opaque black over it. */
      #game {
        position: relative;
      }
      body.render3d #game {
        background: transparent;
      }
      canvas {
        image-rendering: pixelated;
        background: #000;
        /* The frame is sized to the window and rounded up to a whole world
           pixel, so it can overhang by a couple of pixels. Cropping that is
           what "fills the screen" means; letting it scroll is not. */
        display: block;
        max-width: none;
        max-height: none;
      }
    </style>
    <!-- The canvas covers the window, so the address-bar theme should match
         it rather than flashing white on load. -->
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <canvas id="world" hidden></canvas>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
