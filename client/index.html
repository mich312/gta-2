<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>topdown-city</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        background: #000;
        /* The frame is sized to the window and rounded up to a whole world
           pixel, so it can overhang by a couple of pixels. Cropping that is
           what "fills the screen" means; letting it scroll is not. */
        display: block;
        max-width: none;
        max-height: none;
      }
    </style>
    <!-- The canvas covers the window, so the address-bar theme should match
         it rather than flashing white on load. -->
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
